name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      STORAGE_BACKEND: local
      DATABASE_URL: sqlite:///./test_file_metadata.db
      LOCAL_STORAGE_DIR: test_local_storage
      MAX_FILE_SIZE_MB: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
